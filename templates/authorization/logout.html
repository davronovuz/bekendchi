{% extends 'base.html' %}
{% block title %}Chiqish{% endblock %}

{% block content %}
<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card bg-dark text-white shadow-lg border-0 rounded-4 text-center" style="border: 2px solid #00adb5;" data-aos="zoom-in">
        <div class="card-body p-5">
          <div class="mb-4">
            <i class="bi bi-box-arrow-right display-3" style="color: #00adb5;"></i>
          </div>
          <h2 class="fw-bold mb-4" style="color: #00adb5;">Tizimdan chiqdingiz!</h2>
          <p class="text-muted mb-4">ShuLoyiha'dan foydalanganingiz uchun rahmat! Bizni sog‘inasiz deb umid qilamiz.</p>
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'ln' %}" class="btn btn-outline-light py-2 px-4" style="border-color: #00adb5; color: #00adb5;">Qayta kirish</a>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary py-2 px-4">Bosh sahifa</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0, 173, 181, 0.4) !important;
  }
  .btn-outline-light:hover {
    background-color: #00adb5;
    color: #fff;
    border-color: #00adb5;
  }
  .btn-outline-secondary:hover {
    background-color: #333;
    color: #00adb5;
  }
</style>

<!-- AOS animatsiyasi uchun -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>AOS.init();</script>
{% endblock %}
