{% extends 'base.html' %}
{% block title %}Bosh Sahifa{% endblock %}

{% block content %}
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Pacifico&display=swap" rel="stylesheet">

<style>
  body {
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #fff;
    font-family: 'Orbitron', sans-serif;
  }
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 2rem;
  }
  .hero h1 {
    font-size: 3rem;
    font-weight: bold;
    margin-bottom: 1rem;
  }
  .hero p {
    font-size: 1.5rem;
    font-family: 'Pacifico', cursive;
  }
</style>

<div class="hero">
  <h1 id="banner-title">Salom, Dasturchi!</h1>
  <p id="banner-text">Kod bu – zamonaviy she’riyat.</p>
</div>

<script>
  const banners = [
    { title: "Algoritmlar yurak uradi!", text: "Kreativlik — bu kodning yuragi." },
    { title: "Kod bu – zamonaviy she’riyat.", text: "Har satr – yangi bir fikr." },
    { title: "Qora fon, oq matn – bu mening sahnam.", text: "Har kod orqasida orzu yotadi." },
    { title: "0 va 1 orasida million imkoniyat yashiringan.", text: "Kod – bu ijodning eng sof ko‘rinishi." },

    { title: "Terminal – bu ssenariy yoziladigan sahna.", text: "Buyruqlar – ijodiy gaplar." },
    { title: "Kodlash bu sehr emas, bu tartiblangan g‘oya.", text: "Xar bir funksiya — mo‘jiza." },
    { title: "Kod satrlari – orzularni quradigan g‘ishtlar.", text: "Orzularni bajaramiz, kompilyatsiya qilib." },
    { title: "Back-end – bu sehrgarlar yashaydigan joy.", text: "Soxta narsa yo‘q, faqat logika." },
    { title: "Buglar ketadi, ammo tajriba qoladi.", text: "Har xatolik – yangi dars." }
  ];

  const randomBanner = banners[Math.floor(Math.random() * banners.length)];
  document.getElementById('banner-title').innerText = randomBanner.title;
  document.getElementById('banner-text').innerText = randomBanner.text;
</script>
{% endblock %}
