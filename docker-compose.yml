services:
  app:
    build: .
    volumes:
      - .:/app
      - static-data:/app/staticfiles  # Statik fayllar uchun
      - media-data:/app/media  # Media fayllar uchun
      - db-data:/app  # db.sqlite3 fayli joylashgan papkani ulaymiz
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8005 config.wsgi:application"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "7080:7080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static-data:/app/staticfiles  # Statik fayllar
      - media-data:/app/media  # Media fayllar
    depends_on:
      - app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  static-data:
  media-data:
  db-data:  # SQLite fayli uchun volume