services:
  app:
    build: .
    volumes:
      - .:/app
      - static-data:/app/staticfiles  # Statik fayllar uchun
      - media-data:/app/media  # Media fayllar uchun
      - db-data:/app  # db.sqlite3 fayli uchun
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python manage.py makemigrations &&
             python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8005 config.wsgi:application"
    networks:
      - app-network

  nginx:
    image: nginx:latest
    ports:
      - "80:80"    # HTTP uchun
      - "443:443"  # HTTPS uchun
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static-data:/app/staticfiles  # Statik fayllar
      - media-data:/app/media  # Media fayllar
      - certbot-etc:/etc/letsencrypt  # SSL sertifikatlari
      - certbot-var:/var/www/certbot  # Certbot tekshiruvi uchun
    depends_on:
      - app
    networks:
      - app-network

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/www/certbot
    depends_on:
      - nginx
    command: certonly --webroot --webroot-path=/var/www/certbot --email your-email@example.com --agree-tos --no-eff-email -d bekendchi.uz

networks:
  app-network:
    driver: bridge

volumes:
  static-data:
  media-data:
  db-data:
  certbot-etc:  # SSL sertifikatlari uchun
  certbot-var:  # Certbot tekshiruvi uchun