server {
    listen 80;
    server_name bekendchi.uz 194.242.56.190;

    # Certbot tekshiruvi uchun .well-known yo‘lini ochish
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Boshqa so‘rovlar uchun HTTPS ga redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name bekendchi.uz 194.242.56.190;

    # SSL sertifikatlari
    ssl_certificate /etc/letsencrypt/live/bekendchi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bekendchi.uz/privkey.pem;

    # Qo‘shimcha SSL sozlamalari (ixtiyoriy, lekin xavfsizlik uchun tavsiya qilinadi)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Statik fayllar
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media fayllar
    location /media/ {
        alias /app/media/;
    }

    # API so‘rovlarini Django/Gunicorn’ga yo‘naltirish
    location / {
        proxy_pass http://app:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}