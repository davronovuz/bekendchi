# HTTP dan HTTPS ga yo‘naltirish
server {
    listen 7000;
    server_name bekendchi.uz www.bekendchi.uz;
    return 301 https://$host:8443$request_uri;
}

# HTTPS server
server {
    listen 8443 ssl;
    server_name bekendchi.uz www.bekendchi.uz;

    # SSL sertifikat fayllari
    ssl_certificate /etc/letsencrypt/live/bekendchi.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bekendchi.uz/privkey.pem;

    # SSL sozlamalari (ittat.uz dan olingan optimallashtirishlar)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS qo‘shish
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maksimal so‘rov hajmi
    client_max_body_size 900M;

    # Statik fayllar
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Media fayllar
    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # API so‘rovlarini DRF’ga yo‘naltirish
    location / {
        proxy_pass http://bekendchi-app:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}